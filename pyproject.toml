[project]
name = "mics-ddml"
version = "0.1.0"
description = "MICS DoubleML — Causal effects of water treatment on child health"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "doubleml>=0.9",
    "joblib>=1.4",
    "pyreadstat>=1.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "jupyterlab>=4.3",
]
